<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="B.Tech CSE 5th Semester Class Dashboard">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Class Dashboard</title>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">B.Tech CSE • 5th Semester</p>
        <h1>Class Dashboard</h1>
      </div>
      <button id="installBtn" class="icon-btn hidden" title="Install app">⬇️</button>
    </header>

    <section class="date-card">
      <div>
        <div id="dateText" class="date"></div>
        <div id="timeText" class="clock"></div>
      </div>
      <select id="groupSelect" aria-label="Lab group">
        <option value="A1A2">A1 + A2</option>
        <option value="A3A4">A3 + A4</option>
        <option value="A1">A1</option>
        <option value="A2">A2</option>
        <option value="A3">A3</option>
        <option value="A4">A4</option>
      </select>
    </section>

    <section class="hero" id="currentCard"></section>
    <section class="next-card" id="nextCard"></section>

    <section class="panel">
      <div class="panel-head">
        <h2>Today's Classes</h2>
        <span id="todayCount" class="pill"></span>
      </div>
      <div id="todayList" class="class-list"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Weekly Timetable</h2>
      </div>
      <div id="weekList" class="week-list"></div>
    </section>

    <footer>
      <span>Tap a day to view its schedule.</span>
      <span>Works offline after installation.</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
